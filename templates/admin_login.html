<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Hotel Coastal Palace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #0A2342 0%, #051329 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 2.75rem 2.25rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      text-align: center;
    }
    .login-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: #0A2342;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .login-subtitle {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #C59B27;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2 class="login-brand">{{ settings.hotel_name }}</h2>
    <div class="login-subtitle">Management Portal</div>

    <form id="adminLoginForm">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="adminUsername" style="text-align: left;">USERNAME</label>
        <input type="text" id="adminUsername" class="form-control" placeholder="admin" value="admin" required autofocus>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="adminPassword" style="text-align: left;">PASSWORD</label>
        <input type="password" id="adminPassword" class="form-control" placeholder="••••••••••••" value="coastal2026!" required>
      </div>

      <div class="availability-alert error" id="loginAlert" style="margin-bottom: 1.25rem;"></div>

      <button type="submit" class="btn btn-primary" style="width: 100%;" id="btnLoginSubmit">
        SECURE LOGIN
      </button>

      <div style="margin-top: 1.5rem; font-size: 0.85rem; color: #64748B;">
        <a href="/" style="color: #0A2342; font-weight: 600;">← Back to Public Website</a>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('loginAlert');
      alertBox.style.display = 'none';

      const username = document.getElementById('adminUsername').value.trim();
      const password = document.getElementById('adminPassword').value.trim();
      const btn = document.getElementById('btnLoginSubmit');
      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        btn.disabled = false;
        btn.textContent = 'SECURE LOGIN';

        if (!res.ok) {
          alertBox.textContent = data.error || 'Invalid credentials.';
          alertBox.style.display = 'block';
          return;
        }

        window.location.href = '/admin';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'SECURE LOGIN';
        alertBox.textContent = 'Server connection error.';
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
